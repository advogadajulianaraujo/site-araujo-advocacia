name: Robô do DJEN (só à mão)

# 17/11/2026: o CNJ recusa (403) os servidores do GitHub, do Google e do Supabase (São Paulo) — testado. O DJEN é lido pelo painel
# aberto em qualquer computador do escritório (de 2 em 2 h). Este robô fica só para rodar à mão, caso o CNJ libere no futuro.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # 8.34: identidade assinada pelo GitHub (o painel confere; não precisa de segredo)

concurrency:
  group: robo-djen
  cancel-in-progress: false

jobs:
  djen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ler o DJEN e mandar ao painel
        env:
          PAINEL_URL: ${{ secrets.PAINEL_URL }}
          DJEN_ROBO_CHAVE: ${{ secrets.DJEN_ROBO_CHAVE }}
        run: node .github/robo-djen/robo.mjs
